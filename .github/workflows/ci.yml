# 与自建持续集成相同的步骤，仓库托管到 GitHub 时直接可用。自建流水线见 tools/ci/。
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 18 * * *'
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # 定时构建连沙箱，沙箱账号只允许 2 路并发评测
      max-parallel: ${{ github.event_name == 'schedule' && 2 || 8 }}
      matrix:
        step: [contract, java, android, android-stcompat, web, miniprogram, ios, ios-stcompat]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: android-actions/setup-android@v3
        if: startsWith(matrix.step, 'android')
        with:
          # 缺省的包列表含 tools，SDK 仓库已不再提供这个包，这里只装构建用到的包
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: swift-actions/setup-swift@v2
        if: startsWith(matrix.step, 'ios')
        with: {swift-version: '6.0'}
      - name: run ${{ matrix.step }}
        env:
          CI_OUT: ${{ github.workspace }}/ci-out
          # 沙箱密钥只在定时构建中注入，推送与合并请求的构建不调用平台
          YUGU_SANDBOX_APPKEY: ${{ github.event_name == 'schedule' && secrets.YUGU_SANDBOX_APPKEY || '' }}
          YUGU_SANDBOX_SECRET: ${{ github.event_name == 'schedule' && secrets.YUGU_SANDBOX_SECRET || '' }}
          YUGU_SANDBOX_BASE: ${{ vars.YUGU_SANDBOX_BASE || 'https://open.shengzhiai.com' }}
          YUGU_SLOW_TESTS: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: bash ci/run-all.sh ${{ matrix.step }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-out-${{ matrix.step }}
          path: ci-out
  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        step: [ios-macos, ios-stcompat-macos]
    steps:
      - uses: actions/checkout@v4
      - name: run ${{ matrix.step }}
        env:
          CI_OUT: ${{ github.workspace }}/ci-out/${{ matrix.step }}
          YUGU_SANDBOX_APPKEY: ${{ github.event_name == 'schedule' && secrets.YUGU_SANDBOX_APPKEY || '' }}
          YUGU_SANDBOX_SECRET: ${{ github.event_name == 'schedule' && secrets.YUGU_SANDBOX_SECRET || '' }}
          YUGU_SANDBOX_BASE: ${{ vars.YUGU_SANDBOX_BASE || 'https://open.shengzhiai.com' }}
        run: bash ci/${{ matrix.step }}.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-out-${{ matrix.step }}
          path: ci-out
